# API + built PWA in one container, using the local Supabase stack for Postgres, Auth and Storage.
#
#   npx supabase start                       # Postgres/Auth/Storage/Mailpit in Docker (once)
#   cp backend/.env.example backend/.env     # then paste keys from `npx supabase status -o env`
#   docker compose up --build                # from the repo root
#
# URLs: app + API http://localhost:8000 · Swagger http://localhost:8000/docs
#       Supabase Studio http://127.0.0.1:54323 · Mailpit (OTP emails) http://127.0.0.1:54324

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - path: ../backend/.env
        required: true
    environment:
      # The container reaches the host's Supabase ports through host.docker.internal.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "54322"
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_DEV_MAILBOX_URL: http://host.docker.internal:54324
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173
      BACKGROUND_MODE: loop
      DB_POOL_MODE: pooled
      RUN_SEED: ${RUN_SEED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 180s
    ports:
      - "8000:8000"
